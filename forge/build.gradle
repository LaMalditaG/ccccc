plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur" version "2.+"
}

loom {
    forge {
        mixinConfig "ccccc.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

//    modImplementation("cc.tweaked:cc-tweaked-${project.minecraft_version}-common:$cc_version")
//    modImplementation("cc.tweaked:cc-tweaked-${project.minecraft_version}-core:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-common-api:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge-api:$cc_version")
    modRuntimeOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge:$cc_version")
    forgeRuntimeLibrary("cc.tweaked:cobalt:0.9.6")

    modImplementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_forge_version}:slim")   { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.0"))

    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    token = modrinth_token
    projectId = "B1tdnJ0n" // The ID of your Modrinth project. Slugs will not work.
    versionNumber = "${project.mod_version}" // The (preferably SemVer) version of the mod. If not specified, it'll use the `version` declaration
    versionType =  "alpha"
    uploadFile = remapJar // Tells Minotaur to use the remapped jar
    gameVersions = ['1.20.1'] // An array of game versions the version supports
    dependencies {
        required.project "ccccc_"
    }
    changelog = rootProject.file("CHANGELOG.md").text
    syncBodyFrom = rootProject.file("README.md").text
}