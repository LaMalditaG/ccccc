plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur" version "2.+"
}

loom {
    neoForge {
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Used to resolve Cobalt/jzlib without including transitive deps from other configurations
    cobaltDevDeps {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-common-api:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge-api:$cc_version")
    modImplementation("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge:$cc_version")

    modImplementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_neoforge_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation(include("io.github.llamalad7:mixinextras-neoforge:0.5.4"))

    cobaltDevDeps("cc.tweaked:cobalt:0.9.9") { transitive = false }
    cobaltDevDeps("com.jcraft:jzlib:1.1.3") { transitive = false }

    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
}

// In Loom's NeoForge dev env, JarJar does not extract embedded deps from external mod JARs
// (CC:Tweaked bundles Cobalt via JarJar but Loom bypasses this for dep mods).
// We create a synthetic NeoForge library JAR containing Cobalt+jzlib with a neoforge.mods.toml
// so the userdev locator can add it to the module layer directly.
//
// This must happen eagerly at configuration time (not as a lazily-executed task): Loom
// resolves modLocalRuntime during project configuration to remap mods, which is before the
// task graph runs, so a registered task's output file would not exist yet when Loom looks for it.
def cobaltDevJar = layout.buildDirectory.dir('generatedDevLibs').get().file('cobalt-neoforge-dev.jar').asFile
cobaltDevJar.parentFile.mkdirs()
new java.util.zip.ZipOutputStream(new FileOutputStream(cobaltDevJar)).withCloseable { zos ->
    def seenEntries = new HashSet<String>()
    configurations.cobaltDevDeps.files.each { depJar ->
        new java.util.zip.ZipFile(depJar).withCloseable { zf ->
            zf.entries().each { entry ->
                if (entry.directory || !seenEntries.add(entry.name)) return
                zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zf.getInputStream(entry).withCloseable { it.transferTo(zos) }
                zos.closeEntry()
            }
        }
    }
    zos.putNextEntry(new java.util.zip.ZipEntry('META-INF/neoforge.mods.toml'))
    zos.write('''\
modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
    modId="cobalt"
    version="0.9.9"
    displayName="Cobalt"
    description="Cobalt Lua runtime (dev environment shim for CC:Tweaked)"
[[dependencies.cobalt]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.cobalt]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,)"
    ordering="NONE"
    side="BOTH"
'''.bytes)
    zos.closeEntry()
}

dependencies {
    modLocalRuntime(files(cobaltDevJar))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    token = modrinth_token
    projectId = "B1tdnJ0n"
    versionNumber = "${project.mod_version}"
    versionType = "alpha"
    uploadFile = remapJar
    gameVersions = ['1.21.1']
    dependencies {
        required.project "ccccc_"
    }
    changelog = rootProject.file("CHANGELOG.md").text
    syncBodyFrom = rootProject.file("README.md").text
}
