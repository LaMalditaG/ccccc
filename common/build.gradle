architectury {
    common(rootProject.enabled_platforms.split(','))
}

configurations {
    neoForgeClasspath {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom neoForgeClasspath
}

dependencies {
    // Fabric loader is still needed for Architectury annotation processing
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modImplementation("cc.tweaked:cc-tweaked-${project.minecraft_version}-common:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-common-api:$cc_version")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:$cc_version")

    modCompileOnly("com.simibubi.create:create-${project.minecraft_version}:${project.create_neoforge_version}:slim") { transitive = false }

    // NeoForge classes needed for compilation (MountedItemStorage implements IItemHandlerModifiable, etc.)
    neoForgeClasspath("net.neoforged:neoforge:${neoforge_version}") { transitive = false }
}
